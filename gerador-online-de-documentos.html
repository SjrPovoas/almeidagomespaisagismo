<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <header class="w-full max-w-4xl p-4 mb-6 bg-white rounded-xl shadow-md flex items-center justify-center space-x-4">
        <!-- Placeholder para o Logo da Almeida Gomes Paisagismo -->
        <a href="https://almeidagomespaisagismo.com.br/gerador-de-contrato-servico-orcamento.html"
            aria-label="Gerador Online de Documentos">
            <img src="/assets/img/logo-clara.webp" alt="Logo Almeida Gomes Paisagismo"
                class="w-16 h-16 rounded-full object-cover"
                onerror="this.onerror=null; this.src='/assets/img/logo-clara.webp';">
        </a>
        <div class="text-left">
            <h1 class="text-3xl font-bold agp-text-green">Almeida Gomes Paisagismo</h1>
            <p class="text-gray-600 mt-1">Gerador Online de Documentos</p>
        </div>
    </header>

    <main class="w-full max-w-4xl bg-white rounded-xl shadow-2xl p-6 md:p-8">
        <section id="form-section" class="no-print">
            <div class="mb-6 flex flex-col sm:flex-row justify-between items-center border-b pb-4">
                <h2 class="text-2xl font-semibold text-gray-800 mb-4 sm:mb-0">Detalhes do Documento</h2>

                <div class="flex p-1 rounded-full bg-gray-200 shadow-inner overflow-x-auto">
                    <button id="toggleContract" onclick="setDocType('contract')"
                        class="px-4 py-2 text-sm font-medium rounded-full bg-agp-green text-white transition-colors">Contrato</button>
                    <button id="toggleReceipt" onclick="setDocType('receipt')"
                        class="px-4 py-2 text-sm font-medium rounded-full text-gray-700 transition-colors">Recibo</button>
                    <button id="toggleBudget" onclick="setDocType('budget')"
                        class="px-4 py-2 text-sm font-medium rounded-full text-gray-700 transition-colors">Orçamento</button>
                    <button id="toggleTermo" onclick="setDocType('termo')"
                        class="px-4 py-2 text-sm font-medium rounded-full text-gray-700 transition-colors">Recebimento</button>
                </div>
            </div>

            <div id="errorMessage"
                class="hidden text-red-600 bg-red-100 border border-red-400 p-3 rounded mb-4 font-medium"></div>

            <form id="docForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <h3 class="text-lg font-medium agp-text-green border-b pb-1">Dados do Cliente</h3>
                </div>
                <input type="text" id="nomeCliente" placeholder="Nome do Cliente/Empresa" class="form-input">
                <input type="text" id="cpfCliente" placeholder="CPF/CNPJ" class="form-input">
                <input type="text" id="enderecoCliente" placeholder="Endereço Completo"
                    class="form-input md:col-span-2">

                <div class="md:col-span-2 mt-4">
                    <h3 class="text-lg font-medium agp-text-green border-b pb-1">Título e Prazos</h3>
                </div>
                <input type="text" id="tituloServico" placeholder="Título Curto (Ex: Projeto Paisagístico)"
                    class="form-input md:col-span-2">
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Início / Emissão:</label>
                    <input type="date" id="dataInicio" class="form-input">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Fim / Validade:</label>
                    <input type="date" id="dataFim" class="form-input">
                </div>

                <div id="budgetItemsSection" class="md:col-span-2 mt-4 hidden">
                    <h3 class="text-lg font-medium agp-text-green border-b pb-1 mb-3">Itens do Orçamento</h3>
                    <div id="item-list-container" class="space-y-2"></div>
                    <button type="button" onclick="addItem()"
                        class="mt-3 px-4 py-2 text-sm rounded border border-agp-green text-agp-green hover:bg-agp-green hover:text-white transition">+
                        Adicionar Item</button>
                    <div class="text-right mt-4 border-t pt-2 text-xl font-bold agp-text-green">Total: <span
                            id="displayTotal">R$ 0,00</span></div>
                </div>

                <textarea id="descricaoServico" rows="3" placeholder="Descrição Geral do Serviço..."
                    class="form-input md:col-span-2"></textarea>
                <div>
                    <label class="block text-sm text-gray-700 mb-1">Valor Total (R$):</label>
                    <input type="number" id="valorTotal" step="0.01" placeholder="Ex: 1500.00" class="form-input">
                </div>
                <div id="metodoPagamentoContainer">
                    <label class="block text-sm text-gray-700 mb-1">Método de Pagamento:</label>
                    <select id="metodoPagamento" class="form-input">
                        <option value="Pix">Pix</option>
                        <option value="Transferência Bancária">Transferência Bancária</option>
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="Cartão">Cartão de Crédito/Débito</option>
                    </select>
                </div>

                <div id="contractFields" class="md:col-span-2 mt-4">
                    <h3 id="additionalClausesTitle" class="text-lg font-medium agp-text-green border-b pb-1 mb-3">Termos
                        e Condições</h3>
                    <textarea id="clausulasAdicionais" rows="6" class="form-input md:col-span-2"></textarea>
                </div>
            </form>

            <button id="generateButton" onclick="renderPreview()"
                class="w-full mt-6 py-3 rounded-lg text-white font-bold bg-agp-green hover:bg-green-700 transition">Gerar
                Documento</button>
        </section>

        <section id="preview-section" class="hidden mt-6">
            <div class="flex justify-between items-center mb-4 no-print">
                <h2 class="text-xl font-semibold text-gray-800">Visualização</h2>
                <div class="space-x-2">

                        class="px-4 py-2 text-sm font-medium rounded-lg text-white bg-agp-green hover:bg-green-700">Imprimir
                        PDF</button>
                    <button onclick="hidePreview()"
                        class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-300 hover:bg-gray-400">Voltar para
                        Editar</button>
                </div>
            </div>
            <div id="document-output" class="print-area bg-white p-8 border agp-border-green rounded-lg shadow-inner">
            </div>
        </section>

    <footer class="w-full p-4 mb-1 rounded-x1 flex justify-center space-x-6">

            </p>

    <script>
        // 1. VARIÁVEIS E TEXTOS PADRÃO
        let currentDocType = 'contract';
        let budgetItems = [];
        let itemCount = 0;

        const companyInfo = {
            name: "ALMEIDA GOMES PAISAGISMO LTDA",
            cnpj: "38.433.248/0001-19",
            address: "Quadra 30 Lote 10 Jardim América III Águas Lindas de Goiás - GO. Brasil",
            tel: "(61) 99958-8869"
        };

        const defaultContract = "CLÁUSULA DE MULTAS POR INADIMPLEMENTO: \nEm caso de atraso no pagamento superior a [X] dias, será aplicada multa de [Y]% sobre o valor em atraso, além de juros de 1% ao mês.\n\nCLÁUSULA DE GARANTIA: \nA Contratada (Almeida Gomes Paisagismo) oferece garantia de [Z] meses sobre a execução do serviço, excluindo-se danos por mau uso, falta de manutenção ou eventos naturais. O Contratante deve seguir o manual de manutenção. \n\nCLÁUSULA DE RESCISÃO: \nQualquer parte poderá rescindir o contrato mediante aviso prévio por escrito de [W] dias. Se a rescisão for sem justa causa pelo Contratante após o início, este deverá pagar os serviços executados mais uma multa compensatória de [K]% do valor restante.";
        const defaultBudget = "VALIDADE DA PROPOSTA: \nEsta proposta de orçamento é válida por 10 (dez) dias corridos, a contar da data de emissão. Após esse prazo, os valores e prazos podem ser reavaliados. \n\nCONDIÇÕES DE PAGAMENTO: \nPagamento em [X] parcelas, sendo [Y]% no aceite e [Z]% na conclusão. \n\nOBSERVAÇÕES: \nOs valores não incluem serviços não especificados na descrição do item.";
        const defaultTermo = "Declaro que o serviço foi entregue em perfeito estado, de acordo com o solicitado, não havendo qualquer pendência ou defeito visível.";

        // Elementos do DOM
        const els = {
            budgetSection: document.getElementById('budgetItemsSection'),
            descServico: document.getElementById('descricaoServico'),
            valorTotal: document.getElementById('valorTotal'),
            metodoPagContainer: document.getElementById('metodoPagamentoContainer'),
            contractFields: document.getElementById('contractFields'),
            clausesTitle: document.getElementById('additionalClausesTitle'),
            clausesText: document.getElementById('clausulasAdicionais'),
            btnGenerate: document.getElementById('generateButton')
        };

        // 2. CONTROLE DA INTERFACE (TOGGLES)
        function setDocType(type) {
            currentDocType = type;

            // Atualiza botões
            ['Contract', 'Receipt', 'Budget', 'Termo'].forEach(btn => {
                const el = document.getElementById('toggle' + btn);
                if (type === btn.toLowerCase()) {
                    el.className = "px-4 py-2 text-sm font-medium rounded-full bg-agp-green text-white transition-colors";
                } else {
                    el.className = "px-4 py-2 text-sm font-medium rounded-full text-gray-700 transition-colors";
                }
            });

            // Reseta exibições padrão
            els.budgetSection.classList.add('hidden');
            els.descServico.classList.remove('hidden');
            els.metodoPagContainer.classList.add('hidden');
            els.contractFields.classList.remove('hidden');
            els.valorTotal.readOnly = false;

            // Lógica por tipo
            if (type === 'budget') {
                els.budgetSection.classList.remove('hidden');
                els.descServico.classList.add('hidden');
                els.valorTotal.readOnly = true;
                els.clausesTitle.innerText = "Observações e Validade";
                els.clausesText.value = defaultBudget;
                els.btnGenerate.innerText = "Gerar Orçamento para Visualização";
            } else if (type === 'termo') {
                els.clausesTitle.innerText = "Cláusulas Adicionais (Termo de Recebimento e Aceite de Serviços)";
                els.clausesText.value = defaultTermo;
                els.btnGenerate.innerText = "Gerar Termo de Recebimento para Visualização";
            } else if (type === 'contract') {
                els.clausesTitle.innerText = "Cláusulas Contratuais";
                els.clausesText.value = defaultContract;
                els.btnGenerate.innerText = "Gerar Contrato para Visualização";
            } else if (type === 'receipt') {
                els.contractFields.classList.add('hidden');
                els.metodoPagContainer.classList.remove('hidden');
                els.btnGenerate.innerText = "Gerar Recibo para Visualização";
            }
        }

        // 3. LÓGICA DE ITENS DO ORÇAMENTO
        function addItem() {
            itemCount++;
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.id = `itemRow_${itemCount}`;
            div.innerHTML = `
                <input type="text" id="desc_${itemCount}" placeholder="Descrição" class="form-input flex-grow">
                <input type="number" id="qtd_${itemCount}" placeholder="Qtd" value="1" min="1" class="form-input w-20" onchange="calcTotal()">
                <input type="number" id="val_${itemCount}" placeholder="R$ Unit" step="0.01" class="form-input w-28" onchange="calcTotal()">
                <button type="button" onclick="removeItem(${itemCount})" class="text-red-500 font-bold px-2">X</button>
            `;
            document.getElementById('item-list-container').appendChild(div);
            budgetItems.push(itemCount);
        }

        function removeItem(id) {
            document.getElementById(`itemRow_${id}`).remove();
            budgetItems = budgetItems.filter(item => item !== id);
            calcTotal();
        }

        function calcTotal() {
            let total = 0;
            budgetItems.forEach(id => {
                const qtd = parseFloat(document.getElementById(`qtd_${id}`).value) || 0;
                const val = parseFloat(document.getElementById(`val_${id}`).value) || 0;
                total += (qtd * val);
            });
            document.getElementById('displayTotal').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            els.valorTotal.value = total.toFixed(2);
        }

        // 4. GERAÇÃO DO DOCUMENTO FINAL
        function formatData(dataISO) {
            if (!dataISO) return "";
            const [ano, mes, dia] = dataISO.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function formatMoeda(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function showError(msg) {
            const err = document.getElementById('errorMessage');
            err.innerText = msg;
            err.classList.remove('hidden');
            setTimeout(() => err.classList.add('hidden'), 4000);
        }

        function renderPreview() {
            const data = {
                nome: document.getElementById('nomeCliente').value,
                cpf: document.getElementById('cpfCliente').value,
                end: document.getElementById('enderecoCliente').value,
                titulo: document.getElementById('tituloServico').value,
                inicio: formatData(document.getElementById('dataInicio').value),
                fim: formatData(document.getElementById('dataFim').value),
                desc: els.descServico.value,
                valor: document.getElementById('valorTotal').value,
                metodo: document.getElementById('metodoPagamento').value,
                clausulas: els.clausesText.value
            };

            if (!data.nome) return showError("O Nome do Cliente é obrigatório.");

            // NOVO CABEÇALHO COM LOGO LATERAL
            let html = `
        <div class="flex items-center justify-between border-b-2 agp-border-green pb-4 mb-6">
            <div class="flex items-center space-x-4">
                <img src="/assets/img/logo-clara.webp" alt="Logo Almeida Gomes Paisagismo" 
                     class="w-20 h-20 rounded-full object-cover border-2 agp-border-green"
                     onerror="this.onerror=null; this.src='https://placehold.co/80x80/0b4e3e/ffffff?text=AGP';">
                <div class="text-left">
                    <h1 class="text-xl font-bold agp-text-green uppercase leading-tight">${companyInfo.name}</h1>
                    <p class="text-xs text-gray-600 font-medium">CNPJ: ${companyInfo.cnpj}</p>
                    <p class="text-xs text-gray-600">${companyInfo.address}</p>
                    <p class="text-xs text-gray-600">Tel: ${companyInfo.tel}</p>
                </div>
            </div>
        </div>
    `;

            if (currentDocType === 'budget') {
                // Estrutura de Tabela para o Orçamento
                let rows = '';
                budgetItems.forEach((id, index) => {
                    const desc = document.getElementById(`desc_${id}`).value;
                    const qtd = document.getElementById(`qtd_${id}`).value;
                    const valU = parseFloat(document.getElementById(`val_${id}`).value) || 0;
                    const valT = qtd * valU;
                    rows += `
                        <tr class="border-b text-sm">
                            <td class="p-2 text-center">${index + 1}</td>
                            <td class="p-2">${desc}</td>
                            <td class="p-2 text-center">${qtd}</td>
                            <td class="p-2 text-right">${formatMoeda(valU)}</td>
                            <td class="p-2 text-right">${formatMoeda(valT)}</td>
                        </tr>`;
                });

                html += `
                    <h2 class="text-xl font-bold text-center mb-6 uppercase">Orçamento: ${data.titulo}</h2>
                    <p><strong>Cliente:</strong> ${data.nome} <br><strong>Data de Emissão:</strong> ${data.inicio}</p>
                    
                    <table class="w-full mt-6 mb-6 border-collapse">
                        <thead>
                            <tr class="bg-gray-100 border-b">
                                <th class="p-2 text-center w-12">Item</th>
                                <th class="p-2 text-left">Descrição</th>
                                <th class="p-2 text-center w-16">Qtd</th>
                                <th class="p-2 text-right w-24">V. Unit</th>
                                <th class="p-2 text-right w-24">V. Total</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                    <div class="text-right text-lg font-bold mb-6">Total do Orçamento: ${formatMoeda(data.valor)}</div>
                    <div class="text-sm whitespace-pre-line mt-4 p-4 bg-gray-50 border rounded">${data.clausulas}</div>
                `;

            } else if (currentDocType === 'termo') {
                // Lógica para capturar itens ou descrição geral
                let itensFormatados = '';
                if (budgetItems.length > 0) {
                    const listaItens = [];
                    budgetItems.forEach(id => {
                        const desc = document.getElementById(`desc_${id}`).value;
                        if (desc) listaItens.push(desc);
                    });
                    itensFormatados = listaItens.join('<br> - ');
                }

                // Fallback caso não haja itens na tabela de orçamento
                if (!itensFormatados) {
                    itensFormatados = data.desc || 'Serviço de paisagismo/manutenção conforme acordado.';
                }

                const meses = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
                const hoje = new Date();
                const dataExtenso = `${hoje.getDate()} de ${meses[hoje.getMonth()]} de ${hoje.getFullYear()}`;

                html += `
        <div class="space-y-6 text-justify text-sm md:text-base leading-relaxed">
            <div class="text-center mb-8">
                <h1 class="text-xl font-bold uppercase underline">Termo de Recebimento e Aceite de Serviços</h1>
            </div>

            <div>
                <h3 class="font-bold uppercase mb-1">1. DADOS DAS PARTES</h3>
                <p><strong>Contratada/Prestador:</strong> ${companyInfo.name} | <strong>CNPJ:</strong> ${companyInfo.cnpj}</p>
                <p><strong>Contratante/Cliente:</strong> ${data.nome} | <strong>CPF/CNPJ:</strong> ${data.cpf || 'Não informado'}</p>
            </div>

            <div>
                <h3 class="font-bold uppercase mb-1">2. DESCRIÇÃO DOS SERVIÇOS PRESTADOS</h3>
                <p>
                    Declaro que recebi da empresa ${companyInfo.name} os serviços descritos abaixo, finalizados em <strong>${data.fim}</strong>, conforme as especificações contratadas:
                </p>
                <p class="mt-2"><strong>Descrição dos Serviços:</strong><br>${itensFormatados}</p>
            </div>

            <div>
                <h3 class="font-bold uppercase mb-1">3. ACEITE E CONFORMIDADE</h3>
                <p>
                    Declaro que o serviço foi entregue em <strong>perfeito estado</strong>, de acordo com o solicitado, não havendo qualquer pendência ou defeito visível.
                </p>
            </div>

            <div>
